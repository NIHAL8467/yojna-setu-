<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- Background Radial Gradient matching reference image -->
    <radialGradient id="bgLight" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stopColor="#f7f4ee" />
      <stop offset="45%" stopColor="#ebe4d8" />
      <stop offset="100%" stopColor="#ded5c6" />
    </radialGradient>

    <!-- Diagonal Soft Lighting Beam -->
    <linearGradient id="softRay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#ffffff" stopOpacity="0.35" />
      <stop offset="50%" stopColor="#ffffff" stopOpacity="0.05" />
      <stop offset="100%" stopColor="#000000" stopOpacity="0.08" />
    </linearGradient>

    <!-- Gold Metallic Gradients for Lion Capital -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fef08a" />
      <stop offset="25%" stopColor="#facc15" />
      <stop offset="60%" stopColor="#eab308" />
      <stop offset="90%" stopColor="#ca8a04" />
      <stop offset="100%" stopColor="#a16207" />
    </linearGradient>

    <linearGradient id="goldDeep" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#854d0e" />
      <stop offset="40%" stopColor="#ca8a04" />
      <stop offset="80%" stopColor="#fde047" />
      <stop offset="100%" stopColor="#a16207" />
    </linearGradient>

    <linearGradient id="goldBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#fef9c3" />
      <stop offset="30%" stopColor="#eab308" />
      <stop offset="70%" stopColor="#a16207" />
      <stop offset="100%" stopColor="#713f12" />
    </linearGradient>

    <!-- Soft Drop Shadow for Lion Capital 3D Depth -->
    <filter id="shadow3D" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="4" dy="16" stdDeviation="12" floodColor="#78716c" floodOpacity="0.28" />
      <feDropShadow dx="2" dy="6" stdDeviation="4" floodColor="#44403c" floodOpacity="0.2" />
    </filter>
  </defs>

  <!-- 1. Warm Linen/Cream Canvas Background -->
  <rect width="800" height="800" fill="url(#bgLight)" />
  <rect width="800" height="800" fill="url(#softRay)" />

  <!-- 2. Golden Lion Capital of Ashoka (National Emblem) -->
  <g id="national-emblem" transform="translate(260, 160)" filter="url(#shadow3D)">
    <!-- Base Abacus Platform -->
    <path d="M 30 225 L 250 225 C 255 225 260 230 258 238 L 250 255 C 248 260 240 265 230 265 L 50 265 C 40 265 32 260 30 255 L 22 238 C 20 230 25 225 30 225 Z" fill="url(#goldBase)" stroke="#854d0e" stroke-width="1.5" />
    
    <!-- Dharma Chakra in Center of Abacus -->
    <circle cx="140" cy="245" r="14" fill="none" stroke="#713f12" stroke-width="2.5" />
    <circle cx="140" cy="245" r="4" fill="#713f12" />
    <!-- Chakra Spokes -->
    <line x1="140" y1="231" x2="140" y2="259" stroke="#713f12" stroke-width="1.2" />
    <line x1="126" y1="245" x2="154" y2="245" stroke="#713f12" stroke-width="1.2" />
    <line x1="130" y1="235" x2="150" y2="255" stroke="#713f12" stroke-width="1.2" />
    <line x1="130" y1="255" x2="150" y2="235" stroke="#713f12" stroke-width="1.2" />

    <!-- Bull & Horse Relinquish flanking Chakra -->
    <path d="M 60 240 C 70 238 85 244 95 248 C 85 252 70 254 60 250 Z" fill="#ca8a04" />
    <path d="M 220 240 C 210 238 195 244 185 248 C 195 252 210 254 220 250 Z" fill="#ca8a04" />

    <!-- Upper Bell Lotus Pedestal -->
    <path d="M 45 205 L 235 205 C 245 205 250 212 245 225 L 35 225 C 30 212 35 205 45 205 Z" fill="url(#goldLight)" stroke="#a16207" stroke-width="1.2" />
    
    <!-- Three Lions: Back to Back Standing Proud -->

    <!-- Center Lion Forelegs -->
    <rect x="110" y="115" width="16" height="90" rx="6" fill="url(#goldLight)" stroke="#a16207" stroke-width="1.2" />
    <rect x="154" y="115" width="16" height="90" rx="6" fill="url(#goldLight)" stroke="#a16207" stroke-width="1.2" />
    
    <!-- Left Lion Foreleg -->
    <path d="M 60 135 L 75 135 L 82 205 L 68 205 Z" fill="url(#goldDeep)" stroke="#a16207" stroke-width="1.2" />
    <!-- Right Lion Foreleg -->
    <path d="M 220 135 L 205 135 L 198 205 L 212 205 Z" fill="url(#goldDeep)" stroke="#a16207" stroke-width="1.2" />

    <!-- Lion Manes (Stylized sculpted curls) -->
    <!-- Left Lion Head & Mane -->
    <path d="M 45 60 C 40 40 75 35 85 55 C 95 40 105 50 100 70 C 105 85 95 105 85 115 C 65 115 50 95 45 60 Z" fill="url(#goldDeep)" stroke="#713f12" stroke-width="1" />
    <circle cx="70" cy="55" r="4" fill="#713f12" />
    <path d="M 55 68 C 65 72 75 70 80 65" stroke="#713f12" stroke-width="1.5" stroke-linecap="round" fill="none" />

    <!-- Right Lion Head & Mane -->
    <path d="M 235 60 C 240 40 205 35 195 55 C 185 40 175 50 180 70 C 175 85 185 105 195 115 C 215 115 230 95 235 60 Z" fill="url(#goldDeep)" stroke="#713f12" stroke-width="1" />
    <circle cx="210" cy="55" r="4" fill="#713f12" />
    <path d="M 225 68 C 215 72 205 70 200 65" stroke="#713f12" stroke-width="1.5" stroke-linecap="round" fill="none" />

    <!-- Center Lion Torso & Majestic Mane -->
    <path d="M 95 70 C 95 30 185 30 185 70 C 195 90 190 120 180 140 C 160 148 120 148 100 140 C 90 120 85 90 95 70 Z" fill="url(#goldLight)" stroke="#854d0e" stroke-width="1.5" />
    
    <!-- Mane Tuft Layers -->
    <path d="M 105 60 Q 140 85 175 60" stroke="#a16207" stroke-width="2.5" fill="none" />
    <path d="M 100 78 Q 140 108 180 78" stroke="#a16207" stroke-width="2.5" fill="none" />
    <path d="M 102 96 Q 140 126 178 96" stroke="#a16207" stroke-width="2.5" fill="none" />
    <path d="M 108 114 Q 140 140 172 114" stroke="#a16207" stroke-width="2.5" fill="none" />

    <!-- Center Lion Face & Features -->
    <path d="M 116 42 C 116 28 164 28 164 42 C 168 55 160 68 140 70 C 120 68 112 55 116 42 Z" fill="url(#goldLight)" stroke="#713f12" stroke-width="1.2" />
    <!-- Ears -->
    <path d="M 115 32 C 110 24 122 20 126 28 Z" fill="url(#goldBase)" stroke="#713f12" stroke-width="1" />
    <path d="M 165 32 C 170 24 158 20 154 28 Z" fill="url(#goldBase)" stroke="#713f12" stroke-width="1" />
    <!-- Eyes -->
    <ellipse cx="129" cy="42" rx="3.5" ry="4" fill="#713f12" />
    <ellipse cx="151" cy="42" rx="3.5" ry="4" fill="#713f12" />
    <circle cx="130" cy="41" r="1.2" fill="#fef08a" />
    <circle cx="152" cy="41" r="1.2" fill="#fef08a" />
    <!-- Nose & Whiskers Muzzle -->
    <polygon points="137,48 143,48 140,54" fill="#713f12" />
    <path d="M 132 54 C 136 58 144 58 148 54" stroke="#713f12" stroke-width="1.8" fill="none" stroke-linecap="round" />
    <!-- Mouth opening -->
    <path d="M 136 57 C 138 61 142 61 144 57" stroke="#713f12" stroke-width="1.5" fill="#a16207" />
  </g>

  <!-- 3. Typography "National Initiatives & Schemes" matching reference image -->
  <g text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="400" y="520" font-size="44" font-weight="800" fill="#1e293b" letter-spacing="-0.5">
      National Initiatives &amp;
    </text>
    <text x="400" y="585" font-size="52" font-weight="800" fill="#1e293b" letter-spacing="-0.5">
      Schemes
    </text>
  </g>
</svg>
